<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Calculate Your Age Instantly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="themeToggle" class="theme-btn" aria-label="Toggle dark mode">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <div class="container">
        <div class="header">
            <h1>Age Calculator</h1>
            <p class="subtitle">Discover your exact age and upcoming birthday</p>
        </div>

        <div class="input-section">
            <label for="dob">Enter Your Date of Birth:</label>
            <input type="date" id="dob" class="date-input" placeholder="Select your birth date">
            <span class="error-message" id="errorMessage"></span>
        </div>

        <button id="calculate" class="calculate-btn">Calculate Age</button>

        <div id="result" class="result-section hidden">
            <div class="result-card">
                <div class="result-item">
                    <div class="result-label">Exact Age</div>
                    <div class="result-value" id="exactAge">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Total Days Lived</div>
                    <div class="result-value" id="totalDays">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Total Hours</div>
                    <div class="result-value" id="totalHours">-</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Total Minutes</div>
                    <div class="result-value" id="totalMinutes">-</div>
                </div>
            </div>

            <div class="birthday-section">
                <div class="birthday-card">
                    <div class="birthday-label">Next Birthday In:</div>
                    <div class="birthday-countdown" id="birthdayCountdown">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
